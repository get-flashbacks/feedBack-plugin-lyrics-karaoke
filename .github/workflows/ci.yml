name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: got-feedback/.github/.github/workflows/reusable-ci.yml@main

  vocals-release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install route-test dependencies
        run: python -m pip install pytest fastapi pyyaml httpx ruff
      - name: Python syntax and lint
        run: |
          python -m compileall -q routes.py tests
          ruff check --select E4,E7,E9,F routes.py tests
      - name: JavaScript syntax
        run: |
          node --check screen.js
          for file in tests/*.test.js; do node --check "$file"; done
      - name: Install lint tooling
        run: npm ci
      # `npm test` is duplicated with the shared `ci` job above, deliberately:
      # that job runs tests/*.test.js itself, but it lives in an org-owned
      # workflow pinned to @main, which can change without notice. This job is
      # this repo's own gate, so the suite that protects this plugin runs where
      # this repo can see it fail. The one thing worth adding here is lint,
      # which nothing else runs.
      - name: JavaScript lint
        run: npm run lint
      - name: JavaScript tests
        run: npm test
      - name: Generate synthetic packs
        run: python tests/fixtures/generate_feedpaks.py "$RUNNER_TEMP/vocals-fixtures"
      - name: Upload synthetic packs for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: vocals-synthetic-packs
          path: ${{ runner.temp }}/vocals-fixtures/*.sloppak
          if-no-files-found: error
          retention-days: 14
