# Monthly checks. Range-only Python dependencies get individual PRs,
# including librosa, so pitch-analysis changes can be reviewed separately.
# The explicit increase strategy advances lower bounds for review.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 5
  versioning-strategy: increase
